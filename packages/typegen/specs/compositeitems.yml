openapi: 3.0.0
info:
  title: Composite Items
  description: A form or version of an composite item that differs in some respect from other forms of the same or from a standard. You can create your composite items by associating multiple items and their respective quantities.
  contact: {}
  version: 1.0.0
servers:
  - url: https://www.zohoapis.com/inventory/v1
    description: API Endpoint
tags:
  - name: compositeitems
    description: Composite Items Module
paths:
  /compositeitems:
    x-mcp-group:
      - Composite Items
    post:
      tags:
        - compositeitems
      operationId: create_composite_item
      summary: Creating a Composite Item
      description: A new composite item can be created after creating items that we want to associcate with composite item. User can attach image for composite item by calling Different API 'https://www.zohoapis.com/inventory/v1/compositeitems/{composite_item_id}/image', passing form-data parameter image i.e. -F image=bag_s.jpg
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/creating-a-composite-item-request'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/creating-a-composite-item-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoInventory.compositeitems.CREATE
    get:
      tags:
        - compositeitems
      operationId: list_composite_items
      summary: List All Composite Items
      description: List of all composite items.
      parameters:
        - name: page
          in: query
          description: Page Number
          required: false
          schema:
            type: integer
          example: 1
        - name: per_page
          in: query
          description: Items to be displayed per page
          required: false
          schema:
            type: integer
          example: 25
        - name: sort_column
          in: query
          description: 'column to be used for sorting. Allowed values: <code>name</code>,<code>sku</code>,<code>rate</code>,<code>tax_name</code>,<code>purchase_rate</code>,<code>created_time</code>,<code>last_modified_time</code>,<code>reorder_level</code>'
          required: false
          schema:
            type: string
          example: ''
        - name: sort_order
          in: query
          description: order used for sorting
          required: false
          schema:
            type: string
          example: A
        - name: filter_by
          in: query
          description: 'Filter items by status. Allowed values: <code>Status.All</code>,<code>Status.Active</code>,<code>Status.Inactive</code>,<code>Status.Lowstock</code>,<code>Status.Unmapped</code>,<code>Source.Crm</code>,<code>ComboType.Assembly</code>,<code>ComboType.Kit</code>'
          required: false
          schema:
            type: string
          example: ''
        - name: usestate
          in: query
          description: Whether current filter needs to be saved
          required: false
          schema:
            type: boolean
          example: true
        - name: response_option
          in: query
          description: response format number
          required: false
          schema:
            type: integer
          example: 0
        - name: search_text
          in: query
          description: Search composite items by name or other attributes.
          required: false
          schema:
            type: string
        - name: name
          in: query
          description: Search composite items by exact name.
          required: false
          schema:
            type: string
        - name: name_contains
          in: query
          description: Search composite items where name contains the given value.
          required: false
          schema:
            type: string
        - name: name_startswith
          in: query
          description: Search composite items where name starts with the given value.
          required: false
          schema:
            type: string
        - name: sku
          in: query
          description: Search composite items by exact SKU.
          required: false
          schema:
            type: string
        - name: sku_contains
          in: query
          description: Search composite items where SKU contains the given value.
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: 'Filter by status. Allowed values: <code>all</code>, <code>active</code>, <code>inactive</code>.'
          required: false
          schema:
            type: string
        - name: category_id
          in: query
          description: Filter composite items by category ID.
          required: false
          schema:
            type: string
        - name: warehouse_id
          in: query
          description: Filter composite items by warehouse ID.
          required: false
          schema:
            type: string
        - name: tax_id
          in: query
          description: Filter composite items by tax ID.
          required: false
          schema:
            type: string
        - name: last_modified_time
          in: query
          description: Filter composite items modified after the given date and time in UTC format.
          required: false
          schema:
            type: string
        - name: combo_type
          in: query
          description: 'Filter by composite item type. Allowed values: <code>assembly</code>, <code>kit</code>.'
          required: false
          schema:
            type: string
        - name: account_id
          in: query
          description: Filter composite items by sales account ID.
          required: false
          schema:
            type: string
        - name: purchase_account_id
          in: query
          description: Filter composite items by purchase account ID.
          required: false
          schema:
            type: string
        - name: location_id
          in: query
          description: Filter composite items by location ID.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/list-all-composite-items-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoInventory.compositeitems.READ
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /compositeitems/{composite_item_id}:
    x-mcp-group:
      - Composite Items
    get:
      tags:
        - compositeitems
      operationId: get_composite_item
      summary: Retrieving a Composite Item
      description: Retrieving details of an existing compostie item.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/retrieving-a-composite-item-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoInventory.compositeitems.READ
    put:
      tags:
        - compositeitems
      operationId: update_composite_item
      summary: Updating a composite item
      description: Updating details of an existing composite item.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updating-a-composite-item-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/updating-a-composite-item-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoInventory.compositeitems.UPDATE
    delete:
      tags:
        - compositeitems
      operationId: delete_composite_item
      summary: Deleting a Composite Item
      description: Deleting an existing Composite Item.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deleting-a-composite-item-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoInventory.compositeitems.DELETE
    parameters:
      - name: composite_item_id
        in: path
        required: true
        description: Unique identifier of the composite item.
        schema:
          type: string
        example: 504366000000053250
      - $ref: '#/components/parameters/organization_id'
  /compositeitems/{composite_item_id}/active:
    x-mcp-group:
      - Composite Items
    post:
      tags:
        - compositeitems
      operationId: mark_composite_item_active
      summary: Mark as Active
      description: Changing status of an existing composite item to active.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mark-as-active-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoInventory.compositeitems.CREATE
    parameters:
      - name: composite_item_id
        in: path
        required: true
        description: Unique identifier of the composite item.
        schema:
          type: string
        example: 504366000000053250
      - $ref: '#/components/parameters/organization_id'
  /compositeitems/{composite_item_id}/inactive:
    x-mcp-group:
      - Composite Items
    post:
      tags:
        - compositeitems
      operationId: mark_composite_item_inactive
      summary: Mark as Inactive
      description: Changing status of an existing composite item to inactive.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mark-as-inactive-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoInventory.compositeitems.CREATE
    parameters:
      - name: composite_item_id
        in: path
        required: true
        description: Unique identifier of the composite item.
        schema:
          type: string
        example: 504366000000053250
      - $ref: '#/components/parameters/organization_id'
  /compositeitems/{composite_item_id}/image:
    x-mcp-group:
      - Composite Items
    post:
      tags:
        - compositeitems
      operationId: upload_composite_item_image
      summary: Upload Composite Item Images
      description: 'Uploads an image for a composite item. Accepted image formats: <code>gif</code>, <code>png</code>, <code>jpeg</code>, <code>jpg</code>, <code>bmp</code>, <code>webp</code>. Maximum file size is 7 MB.'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: Image file to upload.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/upload-composite-item-image-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoInventory.compositeitems.CREATE
    delete:
      tags:
        - compositeitems
      operationId: delete_composite_item_image
      summary: Delete Composite Item Image
      description: Deletes the images associated with a composite item.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/delete-composite-item-image-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoInventory.compositeitems.DELETE
    parameters:
      - name: composite_item_id
        in: path
        required: true
        description: Unique identifier of the composite item.
        schema:
          type: string
        example: 504366000000053250
      - $ref: '#/components/parameters/organization_id'
  /bundles:
    x-mcp-group:
      - Composite Items
    post:
      tags:
        - compositeitems
      operationId: create_assemblies
      summary: Create Assemblies
      description: Assemblies is the technique of putting together different components in desired quantities to produce a single commodity. These components could be goods, services and other non-inventory items of your choice.
      parameters:
        - name: ignore_auto_number_generation
          in: query
          description: Ignore auto-generation of reference number. If <code>true</code>, the reference number provided in the request body is used as-is.
          required: false
          schema:
            type: boolean
          example: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/create-bundle-request'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/create-bundle-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoInventory.compositeitems.CREATE
    get:
      tags:
        - compositeitems
      operationId: list_assemblies
      summary: Assemblies History
      description: List of all Assemblies of a given composite item.
      parameters:
        - name: composite_item_id
          in: query
          description: Unique ID generated for the composite item by the server. This is used as identifier
          required: true
          schema:
            type: string
          example: 504366000000053250
        - name: item_id
          in: query
          description: Filter assemblies by item ID.
          required: false
          schema:
            type: string
        - name: warehouse_id
          in: query
          description: Filter assemblies by warehouse ID.
          required: false
          schema:
            type: string
        - name: filter_by
          in: query
          description: 'Filter assemblies by date or status. Allowed values: <code>WorkOrderDate.All</code>, <code>WorkOrderDate.Today</code>, <code>WorkOrderDate.ThisWeek</code>, <code>WorkOrderDate.ThisMonth</code>, <code>WorkOrderDate.ThisQuarter</code>, <code>WorkOrderDate.ThisYear</code>, <code>Status.All</code>, <code>Status.Pending</code>, <code>Status.Built</code>, <code>Status.Confirmed</code>.'
          required: false
          schema:
            type: string
          example: Status.All
        - name: sort_column
          in: query
          description: 'Column used for sorting. Allowed values: <code>date</code>, <code>total</code>, <code>created_time</code>, <code>last_modified_time</code>, <code>reference_number</code>.'
          required: false
          schema:
            type: string
          example: created_time
        - name: sort_order
          in: query
          description: 'Order used for sorting. Allowed values: <code>A</code> for ascending, <code>D</code> for descending.'
          required: false
          schema:
            type: string
          example: D
        - name: search_text
          in: query
          description: Search assemblies by keyword.
          required: false
          schema:
            type: string
        - name: location_id
          in: query
          description: Filter assemblies by location ID.
          required: false
          schema:
            type: string
        - name: project_id
          in: query
          description: Filter assemblies by project ID.
          required: false
          schema:
            type: string
        - name: reference_number
          in: query
          description: Search assemblies by exact reference number.
          required: false
          schema:
            type: string
        - name: reference_number_contains
          in: query
          description: Search assemblies where reference number contains the given value.
          required: false
          schema:
            type: string
        - name: date_start
          in: query
          description: Filter assemblies with date on or after the given date (yyyy-mm-dd).
          required: false
          schema:
            type: string
            format: date
        - name: date_end
          in: query
          description: Filter assemblies with date on or before the given date (yyyy-mm-dd).
          required: false
          schema:
            type: string
            format: date
        - name: status
          in: query
          description: 'Filter assemblies by status. Allowed values: <code>draft</code>, <code>confirmed</code>, <code>bundled</code>.'
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Page number to be fetched. Default value is 1.
          required: false
          schema:
            type: integer
            default: 1
          example: 1
        - name: per_page
          in: query
          description: Number of records to be fetched per page. Default value is 200.
          required: false
          schema:
            type: integer
            default: 200
          example: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bundling-history-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoInventory.compositeitems.READ
    parameters:
      - $ref: '#/components/parameters/organization_id'
  /bundles/{bundle_id}:
    x-mcp-group:
      - Composite Items
    get:
      tags:
        - compositeitems
      operationId: get_assembly
      summary: Retrieve Assemblies
      description: Fetches the details for an existing Assemblies.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/retrieve-bundle-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoInventory.compositeitems.READ
    put:
      tags:
        - compositeitems
      operationId: update_assembly
      summary: Update an Assembly
      description: Updates the details of an existing assembly.
      parameters:
        - name: ignore_auto_number_generation
          in: query
          description: Ignore auto-generation of reference number. If <code>true</code>, the reference number provided in the request body is used as-is.
          required: false
          schema:
            type: boolean
          example: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/update-bundle-request'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/update-bundle-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoInventory.compositeitems.UPDATE
    delete:
      tags:
        - compositeitems
      operationId: delete_assembly
      summary: Delete Assemblies
      description: Deletes an existing Assemblies from Zoho Inventory.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/delete-bundle-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoInventory.compositeitems.DELETE
    parameters:
      - name: bundle_id
        in: path
        required: true
        description: Unique identifier of the bundle.
        schema:
          type: string
        example: 504366000000053250
      - $ref: '#/components/parameters/organization_id'
  /bundles/{bundle_id}/bundled:
    x-mcp-group:
      - Composite Items
    post:
      tags:
        - compositeitems
      operationId: mark_assembly_as_built
      summary: Mark Assembly as Assembled
      description: Marks an existing assembly as built, indicating that the composite item has been assembled from its components.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mark-assembly-as-built-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoInventory.compositeitems.CREATE
    parameters:
      - name: bundle_id
        in: path
        required: true
        description: Unique identifier of the bundle.
        schema:
          type: string
        example: 504366000000053250
      - $ref: '#/components/parameters/organization_id'
  /bundles/{bundle_id}/confirmed:
    x-mcp-group:
      - Composite Items
    post:
      tags:
        - compositeitems
      operationId: mark_assembly_as_confirmed
      summary: Mark Assembly as Confirmed
      description: Marks an existing assembly as confirmed.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mark-assembly-as-confirmed-response'
      deprecated: false
      security:
        - Zoho_Auth:
            - ZohoInventory.compositeitems.CREATE
    parameters:
      - name: bundle_id
        in: path
        required: true
        description: Unique identifier of the bundle.
        schema:
          type: string
        example: 504366000000053250
      - $ref: '#/components/parameters/organization_id'
components:
  parameters:
    organization_id:
      name: organization_id
      description: ID of the organization
      in: query
      required: true
      schema:
        type: string
      example: '10234695'
  schemas:
    gendoc-attributes-schema:
      $ref: '#/components/schemas/composite_item'
    name:
      description: Name of the composite item
      type: string
      example: Combo of Apple IPhone and Smartwatch
    composite_item_name:
      description: Name of the composite item
      type: string
      example: Combo of Apple IPhone and Smartwatch
    sku:
      description: Stock Keeping Unit value of the item. It should be unique throughout the product
      type: string
      example: SKUIS
    composite_item_sku:
      description: Stock Keeping Unit value of the composite item. It should be unique throughout the product
      type: string
      example: SKUIS
    unit:
      description: Unit of Item
      type: string
      example: units
    reference_number:
      description: Reference number for the Assemblies.
      type: string
      example: REF-B-00005
    description:
      description: Sample Description.
      type: string
      example: Just a sample description
    purchase_description:
      description: Purchase description of the item
      type: string
      example: Composite item purchase description
    composite_item_id:
      description: Unique ID generated for the composite item by the server. This is used as identifier
      type: string
      example: 504366000000053250
    bundle_id:
      description: Unique ID generated for the Assemblies by the server. This is used as identifier
      type: string
      example: 504366000000053250
    item_id:
      description: Unique ID generated by the server for the Item. This is used as an identifier.
      type: string
      example: 4815000000044208
    rate:
      description: Selling price of the item
      type: number
      format: double
      example: 85000
    pricebook_rate:
      description: Price list applied on the item's selling price.
      type: number
      format: double
      example: 85000
    purchase_rate:
      description: Buying price of the item
      type: number
      format: double
      example: 30000
    initial_stock:
      description: Initial stock of item
      type: number
      format: double
      example: 2
    initial_stock_rate:
      description: Average purchase price of initial stock. This is required for FIFO cost lot tracking and inventory valuation
      type: number
      format: double
      example: 30000
    upc:
      description: Unique Product Code, 12 digit unique code of the item
      type: string
      example: 746325287436
    ean:
      description: European Article Number, 13 digit barcode number of the item
      type: string
      example: 5789414385764
    isbn:
      description: International Standard Book Number, 13 digit unique commercial book identifier barcode of the item
      type: string
      example: 368302334
    part_number:
      description: MPN - Manufacturing Part Number, unambiguously identifies a part design
      type: string
      example: JHFKE7GK7
    status:
      description: Status of the Item
      type: string
      example: active
    is_combo_product:
      description: Defines whether the item is composite or not <code>true for composite items</code>
      type: boolean
      example: true
    item_type:
      description: Type of item <code>Always inventory</code>
      type: string
      example: inventory
    is_taxable:
      description: To check if the item is taxable or not <code>true if the item is taxable, else false </code>
      type: boolean
      example: true
    reorder_level:
      description: Reorder point of the item
      type: number
      format: double
      example: 1
    vendor_id:
      description: Unique ID generated by the server for preferred vendor to buy this composite item
      type: string
      example: 504366000000053250
    vendor_name:
      description: Name of the preferred vendor
      type: string
      example: Mr. vendor combo
    line_items:
      description: A assemblies can contain multiple line items. Each line item contains <code>item_id</code>,<code>name</code>,<code>description</code>,<code>quantity_consumed</code>,<code>unit</code>,<code>account_id</code>,<code>location_id</code>.
      type: array
      items:
        type: object
        properties:
          item_id:
            $ref: '#/components/schemas/item_id'
          line_item_id:
            $ref: '#/components/schemas/line_item_id'
          item_order:
            description: Sort order of the line item.
            type: integer
            example: 1
          name:
            $ref: '#/components/schemas/name'
          description:
            $ref: '#/components/schemas/description'
          quantity_consumed:
            $ref: '#/components/schemas/quantity_consumed'
          unit:
            $ref: '#/components/schemas/unit'
          account_id:
            $ref: '#/components/schemas/account_id'
          account_name:
            $ref: '#/components/schemas/account_name'
          location_id:
            $ref: '#/components/schemas/location_id'
          location_name:
            $ref: '#/components/schemas/location_name'
          rate:
            $ref: '#/components/schemas/rate'
    line_item_id:
      description: Unique ID generated by the server for mapping the associated item with composite item
      type: string
      example: 504366000000053250
    quantity:
      description: Quantity of item associated with the composite item
      type: number
      format: double
      example: 1
    quantity_to_bundle:
      description: Quantity of Assembly to be Assembled.
      type: number
      format: double
      example: 1
    quantity_consumed:
      description: Quantity of item to be Assembled.
      type: number
      format: double
      example: 1
    location_id:
      description: Location ID
      type: string
      example: '460000000038080'
    location_name:
      description: Name of the location
      type: string
      example: Head Office
    tax_id:
      description: Unique ID generated by the server for the tax .
      type: string
      example: 504366000000053100
    tax_name:
      description: Name of the tax applied on selling this item
      type: string
      example: VAT
    tax_percentage:
      description: Percentage at which the item is taxed
      type: number
      format: double
      example: 13
    tax_type:
      description: Type of tax. It can either Tax or Group Tax
      type: string
      example: tax
    customfield_id:
      description: Unique ID generated by the server for the custom field.
      type: string
      example: 504366000000053400
    label:
      description: Label of the custom field.
      type: string
      example: VAT ID
    value:
      description: Value of the custom field.
      type: string
      example: GBGD078
    custom_fields:
      description: Custom fields are used to add more information about the item
      type: array
      items:
        type: object
        properties:
          customfield_id:
