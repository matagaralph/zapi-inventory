name: Publish
on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish
    needs: [check]
    if: github.repository == 'matagaralph/zapi-inventory'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-setup
      - run: bun run build
      # npm trusted publishing (OIDC) needs npm >= 11.5.1; the runner's
      # preinstalled npm predates that, so it silently falls back to
      # classic auth and fails with ENEEDAUTH.
      - run: npm install -g npm@latest
      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          version: bun run changeset:version
          publish: bun run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
